version: '3.8'

services:
  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:3000"
    env_file:
      - .env 

  backend:
    build:
      context: ../backend
    ports:
      - "8080:8080"
    depends_on:
      - db

  nginx:
    build:
      context: ../nginx
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: