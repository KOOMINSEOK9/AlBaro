version: '3.8'

services:
  jenkins:
    build: ./jenkins
    user: jenkins
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins-data:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djava.awt.headless=true
    privileged: true

volumes:
  jenkins_home: