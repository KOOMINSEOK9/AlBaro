version: '3.8'  # Docker Compose 파일 버전

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17  # JDK 17을 사용하는 이미지
    container_name: jenkins
    user: root
    ports:
      - "8081:8080"  # 호스트의 8081 포트를 컨테이너의 8080 포트에 매핑
    volumes:
      - ./jenkins-data:/var/jenkins_home  # 현재 디렉토리의 jenkins-data를 컨테이너에 마운트
    environment:
      - JAVA_OPTS=-Djava.awt.headless=true
    dns:
      - 8.8.8.8  # Google DNS
      - 8.8.4.4  # Google DNS