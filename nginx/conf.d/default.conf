map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend-ws {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name i12b105.p.ssafy.io;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name i12b105.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/i12b105.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i12b105.p.ssafy.io/privkey.pem;


    # 모든 프록시 응답에서 HSTS 헤더 제거
    proxy_hide_header Strict-Transport-Security;

    
    # 전역 보안 헤더 설정
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # WebSocket 설정
    location /ws-stomp {
        proxy_pass http://backend-ws;
        proxy_http_version 1.1;
        
        # 필수 WebSocket 헤더만 유지
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        
        # 다른 모든 헤더 제거
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        
        # CORS는 필요한 경우에만
        add_header 'Access-Control-Allow-Origin' 'https://i12b105.p.ssafy.io' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

    # 프론트엔드
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        add_header Strict-Transport-Security "" always;  # HSTS 헤더 재정의 방지
    }

    # API 경로
    location /api {
        proxy_pass http://backend:8080/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Strict-Transport-Security "" always;  # HSTS 헤더 재정의 방지
    }

    # 파이썬 백엔드
    location /flask/face-recognition/recognize {
        proxy_pass http://i12b105.p.ssafy.io:5000/flask/face-recognition/recognize;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        add_header Strict-Transport-Security "" always;  # HSTS 헤더 재정의 방지
    }
}