server {
    listen 80;
    server_name i12b105.p.ssafy.io;

    # HTTP 요청을 HTTPS로 리디렉션
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name i12b105.p.ssafy.io;

    ssl_certificate /home/ubuntu/app/certbot/conf/live/i12b105.p.ssafy.io/fullchain.pem;  # 인증서 경로
    ssl_certificate_key /home/ubuntu/app/certbot/conf/live/i12b105.p.ssafy.io/privkey.pem;  # 개인 키 경로

    location / {
        proxy_pass http://frontend:3000;  # 프론트엔드 서비스로 프록시
    }

    location /api/ {
        proxy_pass http://backend:8080;  # 백엔드 서비스로 프록시
    }
}저