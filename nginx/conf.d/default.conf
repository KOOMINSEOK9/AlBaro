map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend-ws {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name i12b105.p.ssafy.io;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name i12b105.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/i12b105.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i12b105.p.ssafy.io/privkey.pem;


    # WebSocket 설정
    location /ws-stomp {
        proxy_pass http://backend-ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 헤더 (inherit_off 추가)
        add_header 'Access-Control-Allow-Origin' 'https://i12b105.p.ssafy.io' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' '*' always;
        add_header Strict-Transport-Security "" always;  # HSTS 헤더 재정의 방지

        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_connect_timeout 7d;
        proxy_buffering off;
        proxy_cache off;
    }

    location /wss {
        proxy_pass http://backend-ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SockJS info 엔드포인트를 위한 설정
    location /info {
        proxy_pass http://backend:8080/ws-stomp/info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SockJS info 엔드포인트
    location /ws-stomp/info {
        proxy_pass http://backend:8080/ws-stomp/info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 프론트엔드
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        add_header Strict-Transport-Security "" always;  # HSTS 헤더 재정의 방지
    }

    # API 경로
    location /api {
        proxy_pass http://backend:8080/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Strict-Transport-Security "" always;  # HSTS 헤더 재정의 방지
    }

    # 파이썬 백엔드
    location /flask/face-recognition/recognize {
        proxy_pass http://i12b105.p.ssafy.io:5000/flask/face-recognition/recognize;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        add_header Strict-Transport-Security "" always;  # HSTS 헤더 재정의 방지
    }
}